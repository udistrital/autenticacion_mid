swagger: "2.0"
info:
  title: autenticacion_mid
  description: |
    API MID de autenticación: entrega los datos y roles de los usuarios para sus tokens, y gestiona sus roles y periodos de roles.
  version: 0.2.1
  license:
    name: GNU GPL v3
    url: https://www.gnu.org/licenses/gpl-3.0.html
basePath: /v1
paths:
  /rol/add:
    post:
      tags:
      - rol
      description: |-
        Asigna un rol a un usuario y devuelve sus roles.
        <br>
      operationId: RolController.AddRol
      parameters:
      - in: body
        name: body
        description: Usuario (correo o nombre de usuario) y rol a asignar
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRol'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/requestresponse.APIResponse'
        "400":
          description: El cuerpo de la petición no es válido o el rol no se puede
            gestionar
        "404":
          description: El usuario o el rol no existe
        "409":
          description: El rol ya está asignado al usuario
        "500":
          description: Error interno
  /rol/periods:
    get:
      tags:
      - rol
      description: |-
        Lista los periodos de roles de todos los usuarios. Los usuarios que no se pudieron consultar se indican en Errores.
        <br>
      operationId: RolController.GetAllPeriodos
      parameters:
      - in: query
        name: query
        description: Filtros con el formato campo:valor,campo:valor
        type: string
      - in: query
        name: RolId
        description: IDs de rol separados por comas, p. ej. 1,2,3
        type: string
      - in: query
        name: limit
        description: Cantidad máxima de resultados
        type: string
      - in: query
        name: offset
        description: Posición del primer resultado
        type: string
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/models.MetadataResponse'
        "400":
          description: Los parámetros de consulta no son válidos
        "404":
          description: No se pudieron obtener los periodos
  /rol/remove:
    post:
      tags:
      - rol
      description: |-
        Quita un rol a un usuario y devuelve sus roles.
        <br>
      operationId: RolController.RemoveRol
      parameters:
      - in: body
        name: body
        description: Usuario (correo o nombre de usuario) y rol a quitar
        required: true
        schema:
          $ref: '#/definitions/models.UpdateRol'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/requestresponse.APIResponse'
        "400":
          description: El cuerpo de la petición no es válido o el rol no se puede
            gestionar
        "404":
          description: El usuario o el rol no existe
        "409":
          description: El usuario no tiene asignado el rol
        "500":
          description: Error interno
  /rol/user/{documento}/periods:
    get:
      tags:
      - rol
      description: |-
        Lista los periodos de roles de un usuario.
        <br>
      operationId: RolController.GetPeriodoInfo
      parameters:
      - in: path
        name: documento
        description: Documento del usuario
        required: true
        type: string
      - in: query
        name: query
        description: Filtros con el formato campo:valor,campo:valor
        type: string
      - in: query
        name: limit
        description: Cantidad máxima de resultados
        type: string
      - in: query
        name: offset
        description: Posición del primer resultado
        type: string
      responses:
        "200":
          description: ""
          schema:
            type: array
            items:
              $ref: '#/definitions/models.MetadataResponse'
        "400":
          description: Los parámetros de consulta no son válidos
        "404":
          description: No se pudieron obtener los periodos o el tercero
        "500":
          description: Error interno
  /token/clientAuth:
    post:
      tags:
      - token
      description: |-
        Devuelve un token client_credentials para el cliente.
        <br>
      operationId: TokenController.ClientAuth
      parameters:
      - in: body
        name: body
        description: ID del cliente en base64 y documento del usuario que pide el
          token
        required: true
        schema:
          $ref: '#/definitions/models.ClientAuthRequestBody'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.ClientCredentialsResponse'
        "400":
          description: El cuerpo no es válido, el cliente no está configurado o no
            se pudo obtener el token
  /token/documentoToken:
    post:
      tags:
      - token
      description: |-
        Devuelve los datos y roles del usuario con el documento, incluidos sus datos de estudiante.
        <br>
      operationId: TokenController.GetDocumento
      parameters:
      - in: body
        name: body
        description: Documento del usuario
        required: true
        schema:
          $ref: '#/definitions/models.Documento'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.InfoUsuario'
        "400":
          description: El cuerpo no es válido, el usuario no está registrado o no
            se pudo consultar
  /token/emailToken:
    post:
      tags:
      - token
      description: |-
        Devuelve el código, el estado y el rol ESTUDIANTE del estudiante con el correo.
        <br>
      operationId: TokenController.GetEmail
      parameters:
      - in: body
        name: body
        description: Correo del estudiante
        required: true
        schema:
          $ref: '#/definitions/models.Token'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.UserInfo'
        "400":
          description: El cuerpo no es válido o el correo no es de un estudiante
  /token/userRol:
    post:
      tags:
      - token
      description: |-
        Devuelve los datos y roles del usuario, incluidos sus datos de estudiante.
        <br>
      operationId: TokenController.GetRol
      parameters:
      - in: body
        name: body
        description: Correo o nombre de usuario
        required: true
        schema:
          $ref: '#/definitions/models.UserName'
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.InfoUsuario'
        "400":
          description: El cuerpo no es válido o no indica el usuario
        "500":
          description: El usuario no está registrado o no se pudo consultar
definitions:
  models.ClientAuthRequestBody:
    title: ClientAuthRequestBody
    type: object
    properties:
      clienteId:
        type: string
      documento:
        type: string
  models.ClientCredentialsResponse:
    title: ClientCredentialsResponse
    type: object
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
        format: int64
      scope:
        type: string
      token_type:
        type: string
  models.Documento:
    title: Documento
    type: object
    properties:
      numero:
        type: string
  models.InfoUsuario:
    title: InfoUsuario
    type: object
    properties:
      Codigo:
        type: string
      Estado:
        type: string
      FamilyName:
        type: string
      documento:
        type: string
      documento_compuesto:
        type: string
      email:
        type: string
      role:
        type: array
        items:
          type: string
  models.MetadataResponse:
    title: MetadataResponse
    type: object
    properties:
      Data:
        type: array
        items:
          $ref: '#/definitions/models.Periodo'
      Message:
        type: string
      Metadata:
        $ref: '#/definitions/models.any'
      Status:
        type: integer
        format: int64
      Success:
        type: boolean
  models.Periodo:
    title: Periodo
    type: object
    properties:
      Activo:
        type: boolean
      FechaCreacion:
        type: string
      FechaFin:
        type: string
      FechaInicio:
        type: string
      FechaModificacion:
        type: string
      Finalizado:
        type: boolean
      Id:
        type: integer
        format: int64
      RolId:
        $ref: '#/definitions/models.Rol'
      UsuarioId:
        $ref: '#/definitions/models.Usuario'
  models.Rol:
    title: Rol
    type: object
    properties:
      Activo:
        type: boolean
      FechaCreacion:
        type: string
      FechaModificacion:
        type: string
      Id:
        type: integer
        format: int64
      Nombre:
        type: string
      SistemaInformacionId:
        $ref: '#/definitions/models.any'
  models.Token:
    title: Token
    type: object
    properties:
      email:
        type: string
  models.UpdateRol:
    title: UpdateRol
    type: object
    properties:
      rol:
        type: string
      user:
        type: string
  models.UserInfo:
    title: UserInfo
    type: object
    properties:
      Codigo:
        type: string
      Estado:
        type: string
      email:
        type: string
      rol:
        type: array
        items:
          type: string
  models.UserName:
    title: UserName
    type: object
    properties:
      user:
        type: string
  models.Usuario:
    title: Usuario
    type: object
    properties:
      Activo:
        type: boolean
      Documento:
        type: string
      FechaCreacion:
        type: string
      FechaModificacion:
        type: string
      Id:
        type: integer
        format: int64
  models.any:
    title: any
    type: object
  requestresponse.APIResponse:
    title: APIResponse
    type: object
tags:
- name: token
  description: |
    TokenController entrega la información de los usuarios para sus tokens.
- name: rol
  description: |
    RolController gestiona los roles de los usuarios y sus periodos.
